name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out Superpowers Lite
        uses: actions/checkout@v7

      - name: Check out pinned upstream
        uses: actions/checkout@v7
        with:
          repository: obra/superpowers
          ref: v6.2.0
          path: _upstream

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Run source verification
        run: node scripts/test.mjs

      - name: Verify upstream provenance
        run: node scripts/upstream-sync.mjs check --source "${{ github.workspace }}/_upstream"

      - name: Inspect published package
        run: npm pack --dry-run --json --ignore-scripts
